  }).join('') + '</span>').join('') + '</div>').join('') + '</div>';
}
const mysHTML = sm => `<div class="mys${sm ? ' sm' : ''}"><span>♪</span><b>???</b><span>♪</span></div>`;

/* Confettis (canvas plein écran) */
function makeFX(){
  const c = document.createElement('canvas'); c.className = 'fx'; document.body.appendChild(c);
  const g = c.getContext('2d'); let parts = [], run = false, dpr = 1;
  const size = () => { dpr = Math.min(2, window.devicePixelRatio || 1); c.width = innerWidth * dpr; c.height = innerHeight * dpr; };
  size(); addEventListener('resize', size);
  const piece = (x, y, vx, vy, grav) => ({x, y, vx, vy, g: grav * dpr, s: (7 + Math.random() * 9) * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .3, col: FX_COLORS[Math.floor(Math.random() * FX_COLORS.length)], life: 0});
  function loop(){
    g.clearRect(0, 0, c.width, c.height);
    parts = parts.filter(p => p.y < c.height + 50 && p.life < 900);
    for(const p of parts){
      p.vy += p.g; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.col; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore();
    }
    if(parts.length) requestAnimationFrame(loop); else run = false;
  }
  const go = () => { if(!run){ run = true; requestAnimationFrame(loop); } };
  return {
    burst(n, x, y){ for(let i = 0; i < n; i++) parts.push(piece(x * c.width, y * c.height, (Math.random() - .5) * 16 * dpr, (-Math.random() * 15 - 4) * dpr, .38)); go(); },
    rain(ms){
      const end = Date.now() + ms;
      (function drop(){
        for(let i = 0; i < 5; i++) parts.push(piece(Math.random() * c.width, -20, (Math.random() - .5) * 2 * dpr, Math.random() * 3 * dpr, .07));
        go(); if(Date.now() < end) setTimeout(drop, 70);
      })();
    }
  };
}

/* ---------------- Correspondance tolérante des réponses ---------------- */
const STOP = new Set(['the','le','la','les','l','un','une','a','et','and','de','du','des','d','of']);
function norm(s){
  return String(s || '').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/\(.*?\)|\[.*?\]/g, ' ')
    .replace(/\b(feat|ft|featuring)\b.*$/, ' ')
    .replace(/&/g, ' et ')
    .replace(/[^a-z0-9 ]+/g, ' ')
    .replace(/\s+/g, ' ').trim();
}
function words(s){ return norm(s).split(' ').filter(Boolean); }
function core(s){ const w = words(s); const f = w.filter(x => !STOP.has(x)); return f.length ? f : w; }
function squash(s){ // phonétique très simplifiée, utile pour fr-FR qui écrit les noms anglais « à l'oreille »
  return s.replace(/ph/g,'f').replace(/qu|ck|q|c(?=[aou])/g,'k').replace(/y/g,'i')
          .replace(/ee|ea/g,'i').replace(/oo/g,'ou').replace(/w/g,'ou').replace(/h/g,'')
          .replace(/(.)\1+/g,'$1').replace(/[esxtdz]$/,'');
}
function lev(a, b){
  if(a === b) return 0;
  let prev = Array.from({length: b.length + 1}, (_, i) => i);
  for(let i = 1; i <= a.length; i++){
    const cur = [i];
    for(let j = 1; j <= b.length; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
const digits = s => s.replace(/\D/g, '');
function sim(a, b){ const m = Math.max(a.length, b.length); return m ? 1 - lev(a, b) / m : 1; }
function matches(said, target){
  const tw = core(target); if(!tw.length) return false;
  const tj = squash(tw.join(''));
  const raw = words(said);
  const sw = raw.filter(w => !STOP.has(w));
  if(!raw.length) return false;
  if(norm(said).includes(norm(target))) return true;
  const short = tj.length <= 3;
  const tdig = digits(tj);
  const sdig = digits(raw.join(''));
  if(tdig && sdig && !sdig.includes(tdig)) return false; // un autre nombre a été prononcé
  const thr = tj.length <= 6 ? 0.8 : 0.72;
  for(const list of [sw, raw]){
    const n = tw.length;
    for(let len = Math.max(1, n - 1); len <= n + 1; len++){
      for(let i = 0; i + len <= list.length; i++){
        const cand = squash(list.slice(i, i + len).join(''));
        if(digits(cand) && digits(cand) !== tdig) continue; // « 0 » ne doit pas valider « 2 »
        if(short ? cand === tj : sim(cand, tj) >= thr) return true;
      }
    }
  }
  return false;
}
// Ressemblance maximale (0 à 1), pour afficher « Presque ! »
function bestSim(said, target){
  const tw = core(target); if(!tw.length) return 0;
  const tj = squash(tw.join('')); if(tj.length < 4) return 0;
  const raw = words(said); const sw = raw.filter(w => !STOP.has(w));
  let best = 0;
  for(const list of [sw, raw]){
    const n = tw.length;
    for(let len = Math.max(1, n - 1); len <= n + 1; len++)
      for(let i = 0; i + len <= list.length; i++) best = Math.max(best, sim(squash(list.slice(i, i + len).join('')), tj));
  }
  return best;
}

const ROOM = (new URLSearchParams(location.search).get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
if(ROOM) playerMain(); else hostMain();

/* =====================================================================
   ÉCRAN TV (HÔTE)
   ===================================================================== */
function hostMain(){
  document.body.classList.add('host');
  const H = {
    code: '', peer: null, online: false, err: '',
    players: new Map(), adminKey: null, seen: new Set(), phase: 'lobby', tracks: [], idx: -1, cur: null,
    found: {artist: null, title: null}, foundKey: {artist: null, title: null}, feed: [], feedId: 0,
    q: '', results: null, playlist: null, loading: '', n: 15, auto: true, order: store('bt-order') || 'random', hint: store('bt-hint') !== '0',
    played: new Set(storeJSON('bt-played') || []),
    audio: new Audio(), ctx: null, unlocked: false, nextTO: 0, revealTO: 0, sayTO: 0, roundToken: 0,
    screen: '', drawnRound: -1, drawnRev: null, anim: {artist: false, title: false}, bump: null
  };
  H.audio.preload = 'auto';
  H.audio.addEventListener('ended', () => { if(H.phase === 'playing') reveal(); });
  ['play', 'pause', 'loadedmetadata'].forEach(ev => H.audio.addEventListener(ev, () => { if(H.phase === 'playing' || H.phase === 'reveal'){ updateCtrl(); broadcast(); } }));
  const fx = makeFX();

  const title = t => t.title_short || t.title || '';
  const fieldText = (t, f) => f === 'artist' ? t.artist.name : cleanTitle(title(t));
  const cover = t => (t.album && (t.album.cover_xl || t.album.cover_big || t.album.cover_medium)) || '';
  const joinUrl = () => location.href.split(/[?#]/)[0] + '?room=' + H.code;
  const ranked = () => [...H.players.values()].filter(p => p.plays).sort((a, b) => b.score - a.score);
  const adminP = () => H.adminKey ? H.players.get(H.adminKey) : null;
  const timeLeft = () => H.phase === 'playing' ? Math.max(0, Math.round((H.audio.duration || 30) - (H.audio.currentTime || 0))) : null;

  /* ---- La scène (décor fixe, mis à l'échelle de l'écran) ---- */
  app.innerHTML = `<div id="wrap"><div class="stage" id="stage">
    <div class="a rays" style="inset:0"></div><div class="a vignette" style="inset:0"></div><div class="a halo"></div>
    <div class="a beam b1"></div><div class="a beam b2"></div><div class="a beam b3"></div>
    <div class="a floor"></div><div class="a floorline"></div><div class="a leds"></div>
    <div class="scene" id="scene"></div>
    <div class="a" id="sticker"></div><div class="a" id="splash"></div>
  </div></div>`;
  const stage = $('#stage'), scene = $('#scene');
  const fit = () => stage.style.setProperty('--s', Math.min(innerWidth / 1280, innerHeight / 720));
  fit(); addEventListener('resize', fit);
  function show(screen, html){ H.screen = screen; scene.innerHTML = html; lights(scene); }

  /* ---- Overlays ---- */
  const banner = document.createElement('div');
  banner.className = 'unlock'; banner.textContent = 'Touchez l’écran une fois pour activer le son';
  document.body.appendChild(banner);
  function toast(p, field){
    const el = $('#sticker');
    const long = String(p.name).length > 8;
    el.innerHTML = `${STAR_SVG}<div class="stk">${avHTML(p)}<small>${field === 'artist' ? 'ARTISTE' : 'TITRE'} !</small><b style="font-size:${long ? 15 : 20}px">${esc(p.name)}</b><span>+1 POINT</span></div>`;
    el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  }
  function splash(n, total){
    const el = $('#splash');
    el.innerHTML = `<div class="signwrap">${signHTML('MANCHE ' + n, 92, Math.round(('MANCHE ' + n).length * 72 + 110), 140, 22)}<div class="ribbon">SUR ${total}</div></div>`;
    lights(el); el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  }

  /* ---- Déblocage du son (les navigateurs exigent un premier geste sur l'appareil) ---- */
  function unlock(){
    if(H.unlocked) return;
    H.unlocked = true; banner.remove(); ding([660, 880]); keepAwake();
    H.audio.muted = true;
    H.audio.play().then(() => { H.audio.pause(); H.audio.muted = false; }).catch(() => { H.audio.muted = false; });
    sendAdmin();
  }
  document.addEventListener('pointerdown', unlock);
  document.addEventListener('keydown', unlock);
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && H.unlocked) keepAwake(); });

  /* ---- Réseau ---- */
  function genCode(){ const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for(let i = 0; i < 4; i++) s += A[Math.floor(Math.random() * A.length)]; return s; }
  function connectPeer(){
    if(H.peer) try{ H.peer.destroy(); }catch(e){}
    H.code = genCode(); H.online = false; H.err = '';
    const peer = new Peer(PREFIX + H.code, {debug: 0});
    H.peer = peer;
    peer.on('open', () => { H.online = true; if(H.phase === 'lobby') renderLobby(); });
    peer.on('error', e => {
      if(e.type === 'unavailable-id') return connectPeer();
      if(e.type === 'peer-unavailable') return;
      H.err = 'Réseau : ' + e.type; const n = $('#net'); if(n) n.textContent = H.err;
    });
    peer.on('disconnected', () => { try{ peer.reconnect(); }catch(e){} });
    peer.on('connection', c => {
      c.on('data', d => hostData(c, d));
      c.on('close', () => { const p = c.pkey && H.players.get(c.pkey); if(p && p.conn === c){ p.conn = null; refresh(); } });
    });
  }
  function hostData(c, d){
    if(!d || typeof d !== 'object') return;
    if(d.t === 'hello'){
      const name = String(d.name || '').trim().slice(0, 16) || 'Joueur';
      const k = name.toLowerCase();
      const wantsAdmin = d.role === 'admin';
      if(wantsAdmin){
        const cur = adminP();
        if(cur && cur.key !== k && cur.conn && cur.conn.open){
          try{ c.send({t: 'denied', who: cur.name}); }catch(e){}
          return;
        }
      }
      let p = H.players.get(k);
      if(!p){ p = {name, key: k, score: 0, color: COLORS[H.players.size % COLORS.length], last: '', plays: true, admin: false, say: null}; H.players.set(k, p); }
      p.avatar = isWikiImg(d.avatar) ? d.avatar : '';
      p.avName = String(d.avName || '').slice(0, 40);
      if(wantsAdmin){
        const old = adminP(); if(old && old !== p){ old.admin = false; old.plays = true; }
        H.adminKey = k; p.admin = true; p.plays = !!d.plays;
      } else if(p.admin){ p.admin = false; p.plays = true; H.adminKey = null; }
      if(p.conn && p.conn !== c) try{ p.conn.close(); }catch(e){}
      p.conn = c; c.pkey = k;
      refresh(); sendState(p); sendAdmin();
    } else if(d.t === 'answer'){
      const p = H.players.get(c.pkey); if(p && p.plays) onAnswer(p, d);
    } else if(d.t === 'cmd'){
      if(c.pkey && c.pkey === H.adminKey) adminCmd(d);
    }
  }
  function boardState(){
    const t = H.cur; if(!t || H.phase === 'lobby') return null;
    const showRev = H.phase === 'reveal' || H.phase === 'end';
    const fs = f => {
      const text = fieldText(t, f); const shown = !!H.found[f] || showRev;
      return {text: shown ? text : (H.hint ? maskOf(text) : ''), shown, by: H.found[f] || null};
    };
    return {artist: fs('artist'), title: fs('title')};
  }
  function sendState(p){
    if(!p.conn || !p.conn.open) return;
    const r = ranked(); const t = H.cur;
    const showRev = t && (H.phase === 'reveal' || H.phase === 'end');
    try{
      p.conn.send({
        t: 'state', phase: H.phase, round: H.idx + 1, total: H.tracks.length,
        score: p.score, rank: r.indexOf(p) + 1, count: r.length, me: p.name, color: p.color,
        admin: !!p.admin, plays: !!p.plays, hint: H.hint,
        found: {artist: H.found.artist, title: H.found.title},
        board: boardState(), left: timeLeft(), paused: H.audio.paused,
        reveal: showRev ? {artist: t.artist.name, title: fieldText(t, 'title'), cover: t.album && t.album.cover_medium} : null
      });
    }catch(e){}
  }
  const broadcast = () => { H.players.forEach(sendState); sendAdmin(); };

  /* ---- Animateur (téléphone) ---- */
  function sendAdmin(){
    const p = adminP();
    if(!p || !p.conn || !p.conn.open) return;
    const a = {t: 'admin', phase: H.phase, unlocked: H.unlocked, auto: H.auto, n: H.n, order: H.order, hint: H.hint};
    if(H.phase === 'lobby'){
      a.results = Array.isArray(H.results)
        ? H.results.slice(0, 30).map(r => ({id: r.id, title: r.title, nb: r.nb_tracks, pic: r.picture_small || r.picture_medium}))
        : H.results;
      a.playlist = H.playlist ? {id: H.playlist.id, title: H.playlist.title, count: H.playlist.tracks.length} : null;
      a.loading = H.loading; a.q = H.q;
      a.players = [...H.players.values()].filter(x => x.plays).map(x => ({name: x.name, on: !!x.conn}));
    } else {
      const t = H.cur;
      a.round = H.idx + 1; a.total = H.tracks.length; a.paused = H.audio.paused;
      a.track = t ? {artist: t.artist.name, title: fieldText(t, 'title'), cover: t.album && (t.album.cover_small || t.album.cover_medium)} : null;
      a.found = H.found;
      a.feed = H.feed.slice(-6).reverse().map(f => ({id: f.id, name: (H.players.get(f.key) || {}).name || '?', text: f.text, got: f.got, near: !!f.presque}));
      a.players = ranked().map(x => ({key: x.key, name: x.name, score: x.score, on: !!x.conn, avatar: x.avatar, color: x.color}));
    }
    try{ p.conn.send(a); }catch(e){}
  }
  function adminCmd(d){
    switch(d.c){
      case 'search': { const q = $('#q'); if(q) q.value = String(d.q || ''); search(String(d.q || '')); break; }
      case 'pick': { const id = String(d.id || '').replace(/\D/g, ''); if(id) pick(id); break; }
      case 'set':
        if(d.n) H.n = Math.max(5, Math.min(50, +d.n || 15));
        if('auto' in d) H.auto = !!d.auto;
        if('hint' in d){ H.hint = !!d.hint; store('bt-hint', H.hint ? '1' : '0'); }
        if(d.order === 'random' || d.order === 'playlist'){ H.order = d.order; store('bt-order', H.order); }
        if(H.phase === 'lobby') updateOpts();
        sendAdmin(); break;
      case 'start': if(H.phase === 'lobby') startGame(); break;
      case 'pause': ACT.pause(); break;
      case 'next': next(); break;
      case 'give': ACT.give(d); break;
      case 'score': {
        const p = H.players.get(String(d.key || ''));
        if(p){ p.score = Math.max(0, p.score + (+d.d > 0 ? 1 : -1)); if(+d.d > 0) H.bump = p.key; refresh(); broadcast(); }
        break;
      }
      case 'quit': if(H.phase === 'playing' || H.phase === 'reveal') endGame(); break;
      case 'lobby': if(H.phase === 'end') backToLobby(); break;
    }
  }
  function freeAdmin(){
    const p = adminP(); H.adminKey = null;
    if(p){ p.admin = false; p.plays = true; try{ p.conn && p.conn.open && p.conn.send({t: 'revoked'}); }catch(e){} sendState(p); }
    refresh();
  }

  /* ---- Deezer (JSONP, pas de clé nécessaire) ---- */
  let jsonpN = 0;
  function dz(path){
    return new Promise((res, rej) => {
      const cb = '__dz' + (++jsonpN) + '_' + Date.now();
      const s = document.createElement('script');
      const done = () => { clearTimeout(to); try{ delete window[cb]; }catch(e){ window[cb] = undefined; } s.remove(); };
      const to = setTimeout(() => { done(); rej(new Error('Deezer ne répond pas')); }, 12000);
      window[cb] = d => { done(); (d && d.error) ? rej(new Error(d.error.message || 'Erreur Deezer')) : res(d); };
      s.onerror = () => { done(); rej(new Error('Deezer injoignable')); };
      s.src = 'https://api.deezer.com' + path + (path.includes('?') ? '&' : '?') + 'output=jsonp&callback=' + cb;
      document.head.appendChild(s);
    });
  }
  async function search(q){
    q = q.trim(); if(!q) return;
    H.q = q; H.results = 'loading'; updateResults(); updateStrips();
    try{ const d = await dz('/search/playlist?q=' + encodeURIComponent(q) + '&limit=30'); H.results = d.data || []; }
    catch(e){ H.results = e.message; }
    updateResults();
  }
  async function pick(id){
    H.loading = 'Chargement de la playlist…'; updateChosen();
    try{
      const [info, tr] = await Promise.all([dz('/playlist/' + id), dz('/playlist/' + id + '/tracks?limit=1000')]);
      const tracks = (tr.data || []).filter(t => t.readable !== false && t.preview && t.artist);
      if(tracks.length < 3) throw new Error('Pas assez de titres lisibles dans cette playlist');
      H.playlist = {id, title: info.title, picture: info.picture_medium, tracks};
      H.loading = '';
    }catch(e){ H.loading = '⚠ ' + e.message; }
    if(H.phase === 'lobby'){ updateChosen(); updateResults(); updateOpts(); }
  }

  /* ---- Partie ---- */
  function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function ding(freqs, type){
    try{
      if(!H.ctx) H.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if(H.ctx.state === 'suspended') H.ctx.resume();
      const t0 = H.ctx.currentTime;
      (freqs || [880, 1320]).forEach((f, i) => {
        const o = H.ctx.createOscillator(), g = H.ctx.createGain();
        o.frequency.value = f; o.type = type || 'triangle';
        g.gain.setValueAtTime(0.0001, t0 + i * .09); g.gain.exponentialRampToValueAtTime(.25, t0 + i * .09 + .02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * .09 + .35);
        o.connect(g).connect(H.ctx.destination); o.start(t0 + i * .09); o.stop(t0 + i * .09 + .4);
      });
    }catch(e){}
  }
  function markPlayed(id){
    H.played.add(id);
    const arr = [...H.played].slice(-800); H.played = new Set(arr); storeJSON('bt-played', arr);
  }
  function startGame(){
    if(!H.playlist || H.loading) return;
    const all = H.playlist.tracks;
    if(H.order === 'playlist'){
      H.tracks = all.slice(0, H.n);
    } else {
      // Aléatoire, en privilégiant les titres jamais passés lors des parties précédentes
      const fresh = shuffle(all.filter(t => !H.played.has(t.id)));
      const old = shuffle(all.filter(t => H.played.has(t.id)));
      H.tracks = fresh.concat(old).slice(0, H.n);
    }
    H.players.forEach(p => { p.score = 0; p.last = ''; p.say = null; });
    H.idx = -1; H.cur = null; H.drawnRound = -1;
    startRound();
  }
  async function startRound(){
    clearTimeout(H.nextTO); clearTimeout(H.revealTO);
    const token = ++H.roundToken;
    H.idx++;
    if(H.idx >= H.tracks.length) return endGame();
    let t = H.tracks[H.idx];
    try{ const fresh = await dz('/track/' + t.id); if(fresh && fresh.preview) t = fresh; }catch(e){} // liens d'extraits frais (ils expirent)
    if(token !== H.roundToken) return;
    if(!t.preview) return startRound();
    markPlayed(H.tracks[H.idx].id);
    H.cur = t; H.found = {artist: null, title: null}; H.foundKey = {artist: null, title: null}; H.feed = []; H.phase = 'playing';
    H.players.forEach(p => { p.say = null; });
    H.audio.src = t.preview; H.audio.currentTime = 0;
    renderGame(); broadcast();
    splash(H.idx + 1, H.tracks.length);
    ding([392, 523], 'sine');
    try{ await H.audio.play(); }catch(e){ updateCtrl(); sendAdmin(); }
  }
  function reveal(){
    if(H.phase !== 'playing') return;
    clearTimeout(H.revealTO);
    H.anim = {artist: !H.found.artist, title: !H.found.title};
    H.phase = 'reveal'; renderGame(); broadcast();
    if(H.auto) H.nextTO = setTimeout(next, 8000);
  }
  function next(){
    clearTimeout(H.nextTO); clearTimeout(H.revealTO);
    if(H.phase === 'playing') return reveal();
    if(H.phase === 'reveal') startRound();
  }
  function endGame(){
    clearTimeout(H.nextTO); clearTimeout(H.revealTO); H.roundToken++;
    H.audio.pause(); H.phase = 'end'; renderEnd(); broadcast(); ding([523, 659, 784, 1046]);
    setTimeout(() => fx.rain(4500), 900);
  }
  function backToLobby(){ H.phase = 'lobby'; H.cur = null; H.players.forEach(p => { p.score = 0; p.say = null; }); renderLobby(); broadcast(); }
  function award(p, field){
    if(H.phase !== 'playing' || H.found[field] || !p) return false;
    H.found[field] = p.name; H.foundKey[field] = p.key; p.score++;
    H.anim[field] = true; H.bump = p.key;
    ding(); toast(p, field); fx.burst(70, .7, .3);
    if(H.found.artist && H.found.title) H.revealTO = setTimeout(reveal, 1800);
    return true;
  }
  function onAnswer(p, d){
    const text = String(d.text || '').slice(0, 120);
    if(H.phase === 'lobby'){ if(d.final){ p.last = text; refresh(); } return; }
    if(H.phase !== 'playing' || !H.cur) return;
    const texts = [text, ...(Array.isArray(d.alts) ? d.alts : [])].map(s => String(s).slice(0, 120)).filter(Boolean);
    const got = [];
    for(const field of ['artist', 'title']){
      if(H.found[field]) continue;
      const target = field === 'artist' ? H.cur.artist.name : title(H.cur);
      if(texts.some(s => matches(s, target)) && award(p, field)) got.push(field);
    }
    let presque = false;
    if(d.final && !got.length){
      for(const field of ['artist', 'title']){
        if(H.found[field]) continue;
        const target = field === 'artist' ? H.cur.artist.name : title(H.cur);
        if(texts.some(s => bestSim(s, target) >= .5)) presque = true;
      }
    }
    if(d.final || got.length){
      const entry = {id: ++H.feedId, key: p.key, text, got, presque, t: Date.now(), round: H.idx, final: true};
      H.feed.push(entry); if(H.feed.length > 30) H.feed.shift();
      p.say = entry;
    } else {
      p.say = {text, got: [], t: Date.now(), round: H.idx, final: false};
    }
    clearTimeout(H.sayTO); H.sayTO = setTimeout(() => H.screen === 'game' && updateLecterns(), 8200);
    if(got.length){ renderGame(); broadcast(); } else { updateLecterns(); if(d.final) sendAdmin(); }
  }

  /* ---- Rendu : salon ---- */
  function refresh(){
    if(H.phase === 'lobby'){
      if(H.screen !== 'lobby') return renderLobby();
      $('#chips').innerHTML = chipsHTML(); $('#admline').innerHTML = adminLineHTML(); sendAdmin();
    }
    else if(H.phase === 'end') renderEnd();
    else if(H.screen === 'game'){ updateLecterns(); updateCode(); sendAdmin(); }
  }
  function qrSVG(url){
    try{
      const q = qrcode(0, 'M'); q.addData(url); q.make();
      const n = q.getModuleCount(); let d = '';
      for(let r = 0; r < n; r++) for(let c = 0; c < n; c++) if(q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
      return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="QR code pour rejoindre la partie"><path d="${d}" fill="#1A0B10"/></svg>`;
    }catch(e){ return ''; }
  }
  function chipsHTML(){
    const list = [...H.players.values()].filter(p => p.plays);
    if(!list.length) return '<div class="empty">Les candidats apparaîtront ici : scannez le billet !</div>';
    const w = Math.min(104, Math.floor((1024 - (list.length - 1) * 12) / list.length));
    return list.map(p => {
      const isNew = !H.seen.has(p.key); H.seen.add(p.key);
      return `<div class="arr ${isNew ? 'new' : ''} ${p.conn ? '' : 'off'}" style="--c:${p.color};width:${w}px"><div class="pool"></div>${p.last ? `<div class="say">« ${esc(p.last)} »</div>` : ''}${avHTML(p)}<b class="nm plate">${esc(p.name)}</b></div>`;
    }).join('');
  }
  function adminLineHTML(){
    const a = adminP();
    return a
      ? `<div class="admline ${a.conn ? '' : 'off'}">${avHTML(a, 'xs')}<span>Régie : <b>${esc(a.name)}</b>${a.plays ? '' : ' (ne joue pas)'}</span><button class="mini-btn" data-act="freeadmin">Retirer</button></div>`
      : '<div class="admline muted">Pas d’animateur : choisis « Animer la partie » en rejoignant avec ton téléphone.</div>';
  }
  function resultsHTML(){
    const r = H.results;
    if(r === null) return '<div class="msg">Choisis un thème sur le juke-box, ou lance une recherche.</div>';
    if(r === 'loading') return '<div class="msg">Recherche…</div>';
    if(typeof r === 'string') return '<div class="msg warn">' + esc(r) + '</div>';
    if(!r.length) return '<div class="msg">Aucun résultat.</div>';
    return r.map(p => `<button class="sleeve ${H.playlist && H.playlist.id == p.id ? 'sel' : ''}" data-act="pick" data-id="${esc(p.id)}"><img loading="lazy" src="${esc(p.picture_medium)}" alt=""><b>${esc(p.title)}</b><span>${esc(p.nb_tracks)} titres</span></button>`).join('');
  }
  function chosenHTML(){
    if(H.loading) return `<span class="muted">${esc(H.loading)}</span>`;
    if(!H.playlist) return '<span class="muted">Aucune playlist choisie</span>';
    return `<span class="ok">✓</span> ${esc(H.playlist.title)} <span class="muted">· ${H.playlist.tracks.length} extraits</span>`;
  }
  function optsHTML(){
    return `<div class="o1"><span class="olbl">CHANSONS</span><div class="seg">${[10, 15, 20, 30].map(n => `<button type="button" class="${n === H.n ? 'on' : ''}" data-act="setn" data-n="${n}">${n}</button>`).join('')}</div>
      <span class="olbl">ORDRE</span><div class="seg"><button type="button" class="${H.order === 'random' ? 'on' : ''}" data-act="setord" data-o="random">HASARD</button><button type="button" class="${H.order === 'playlist' ? 'on' : ''}" data-act="setord" data-o="playlist">PLAYLIST</button></div></div>
      <div class="o2"><label class="sw"><input type="checkbox" id="auto" ${H.auto ? 'checked' : ''}>Enchaîner auto</label><label class="sw" title="Affiche le nombre de mots et de lettres à trouver"><input type="checkbox" id="hint" ${H.hint ? 'checked' : ''}>Indice lettres</label></div>
      <button class="btn-launch" data-act="start" ${H.playlist && !H.loading ? '' : 'disabled'}>LANCER<br>LE SHOW</button>`;
  }
  const stripsHTML = () => PRESETS.map((p, i) => `<button type="button" class="strip ${H.q === p ? 'on' : ''}" data-act="preset" data-q="${esc(p)}"><b>${'AB'[Math.floor(i / 5)]}${i % 5 + 1}</b><span>${esc(p)}</span></button>`).join('');
  const updateResults = () => { const el = $('#results'); if(el) el.innerHTML = resultsHTML(); sendAdmin(); };
  const updateChosen = () => { const el = $('#chosen'); if(el) el.innerHTML = chosenHTML(); const b = $('[data-act="start"]'); if(b) b.disabled = !(H.playlist && !H.loading); sendAdmin(); };
  const updateOpts = () => { const el = $('#opts'); if(el) el.innerHTML = optsHTML(); };
  const updateStrips = () => { const el = $('#strips'); if(el) el.innerHTML = stripsHTML(); };
  const netText = () => H.err || (H.online ? 'Prêt : scannez pour rejoindre' : 'Connexion au réseau…');

  function renderLobby(){
    const qVal = $('#q') ? $('#q').value : H.q;
    H.drawnRound = -1;
    stage.classList.remove('paused');
    show('lobby', `
      <div class="a l-sign signwrap">${signHTML('BLIND TEST', 46, 430, 76)}<div class="ribbon">SCANNE · CHANTE · GAGNE</div></div>
      <section class="a ticket" aria-label="Rejoindre la partie">
        <div class="tk-head">★ BILLET D’ENTRÉE ★</div>
        <div class="tk-sub">UN CANDIDAT PAR TÉLÉPHONE</div>
        <div class="tk-qr">${H.online ? qrSVG(joinUrl()) : '<div class="ph"></div>'}</div>
        <div class="tk-code"><small>CODE</small><b>${esc(H.code)}</b></div>
        <div id="net" class="tk-net">${esc(netText())}</div>
        ${location.protocol === 'file:' ? '<div class="tk-warn">Page ouverte en local : les téléphones ne pourront pas la rejoindre. Héberge-la en HTTPS (GitHub Pages).</div>' : ''}
        <div class="tk-sep"></div>
        <div id="admline">${adminLineHTML()}</div>
      </section>
      <section class="a prog cabinet" aria-label="Choix de la playlist">
        <div class="cabin cabinner">
          <div class="glare"></div><div class="neon"></div>
          <div class="p-head"><span class="plaque">LA PLAYLIST</span><div id="chosen" class="chosen">${chosenHTML()}</div></div>
          <form id="sform" class="p-search"><input class="inp" id="q" placeholder="Rechercher un thème, ou coller un lien Deezer" value="${esc(qVal)}" aria-label="Rechercher une playlist"><button class="btn-gold">CHERCHER</button></form>
          <div id="strips" class="strips">${stripsHTML()}</div>
          <div id="results" class="results">${resultsHTML()}</div>
          <div id="opts" class="p-foot">${optsHTML()}</div>
        </div>
      </section>
      <div id="chips" class="a arrivals">${chipsHTML()}</div>`);
    $('#sform').onsubmit = e => {
      e.preventDefault();
      const v = $('#q').value.trim(); if(!v) return;
      const m = v.match(/playlist\/(\d+)/) || v.match(/^(\d{4,})$/);
      if(m) pick(m[1]);
      else if(/^https?:/i.test(v)){ H.loading = '⚠ Lien non reconnu : ouvre-le dans le navigateur et copie l’adresse complète (…/playlist/123456).'; updateChosen(); }
      else search(v);
    };
    sendAdmin();
  }

  /* ---- Rendu : manche ---- */
  function fieldHTML(field){
    const t = H.cur;
    const text = fieldText(t, field);
    const rev = H.phase === 'reveal' || H.phase === 'end';
    const by = H.foundKey[field] && H.players.get(H.foundKey[field]);
    const shown = !!H.found[field] || rev;
    const st = tileStats(text);
    let chip;
    if(by) chip = `<span class="chip ok">${avHTML(by, 'xs')}trouvé par ${esc(by.name)}</span>`;
    else if(rev) chip = '<span class="chip none">personne !</span>';
    else chip = `<span class="hintt">${H.hint ? `${st.words} mot${st.words > 1 ? 's' : ''} · ${st.letters} lettre${st.letters > 1 ? 's' : ''}` : 'à trouver'}</span>`;
    const body = shown ? tilesHTML(text, {maxW: 668, maxH: 98, max: 64, anim: H.anim[field]})
      : (H.hint ? tilesHTML(maskOf(text), {maxW: 668, maxH: 98, max: 64}) : mysHTML());
    return `<div class="field"><div class="fhead"><span class="plaque">${field === 'artist' ? 'ARTISTE' : 'TITRE'}</span>${chip}</div><div class="fbody">${body}</div></div>`;
  }
  function recHTML(t, rev){
    return `<div class="a ring chrome"></div><div class="a win window"></div>
      <div class="a disc grooves spin"><div class="a lbl redlabel">${rev && cover(t) ? `<img src="${esc(cover(t))}" alt="">` : '<small>MYSTÈRE</small><b>?</b>'}</div></div>
      <div class="a dshine shine"></div>
      <div class="a pivot silver"></div><div class="a arm"><i class="silver"></i><u class="silver"></u></div>`;
  }
  function lecternsHTML(){
    const list = [...H.players.values()].filter(p => p.plays);
    const n = list.length; if(!n) return '';
    const lw = Math.min(164, Math.floor((1024 - (n - 1) * 14) / n)); const k = lw / 164;
    const top = Math.max(0, ...list.map(p => p.score));
    const now = Date.now();
    return `<div class="a lecs" style="--k:${k.toFixed(3)};--lw:${lw}px">` + list.map(p => {
      const lead = top > 0 && p.score === top;
      const s = p.say && p.say.round === H.idx && now - p.say.t < 8000 ? p.say : null;
      let bub = '';
      if(s && (H.phase === 'playing' || s.got.length)){
        const stamp = s.got.length ? `<span class="stamp ok">${s.got.map(g => g === 'artist' ? 'ARTISTE' : 'TITRE').join(' + ')} ✓</span>` : (s.presque ? '<span class="stamp">PRESQUE !</span>' : '');
        const gv = s.final && !s.got.length && H.phase === 'playing'
          ? ['artist', 'title'].filter(f => !H.found[f]).map(f => `<button class="give" data-act="give" data-i="${s.id}" data-f="${f}">+ ${f === 'artist' ? 'ARTISTE' : 'TITRE'}</button>`).join('') : '';
        bub = `<div class="bub ${s.drawn ? '' : 'in'} ${s.final ? '' : 'live'}">${stamp}<span class="q">« ${esc(s.text)} »</span>${gv ? `<div class="gv">${gv}</div>` : ''}</div>`;
        if(s.final) s.drawn = true;
      }
      const talk = s && now - s.t < 1500 ? 'talk' : '';
      const sc = pad2(p.score);
      return `<div class="lec ${lead ? 'lead' : ''} ${p.conn ? '' : 'off'} ${H.bump === p.key ? 'bump' : ''} ${talk}" style="--c:${p.color};--cd:${shade(p.color, .45)}">
        <div class="pool"></div>${bub}${lead ? CROWN_SVG : ''}
        <div class="head">${avHTML(p)}</div>
        <div class="deskrow"><div class="dome"></div><div class="lip desk"></div></div>
        <div class="panel"><b class="nm plate">${esc(p.name)}</b><span class="ledbox"><span class="ghost">${'8'.repeat(sc.length)}</span><span class="led">${sc}</span></span></div>
      </div>`;
    }).join('') + '</div>';
  }
  function updateLecterns(){ const el = $('#lecs'); if(el){ el.innerHTML = lecternsHTML(); H.bump = null; } }
  function updateCtrl(){
    stage.classList.toggle('paused', H.audio.paused && H.screen === 'game');
    const el = $('#ctrl'); if(!el) return;
    const rev = H.phase === 'reveal'; const last = H.idx + 1 >= H.tracks.length;
    el.innerHTML = `<button class="cbtn" data-act="pause">${H.audio.paused ? ICON.play + (H.audio.currentTime > 0 ? 'REPRENDRE' : 'LANCER') : ICON.pause + 'PAUSE'}</button>
      <button class="cbtn gold" data-act="next">${ICON.next}${rev ? (last ? 'RÉSULTATS' : 'SUIVANT') : 'RÉVÉLER'}</button>
      <button class="cbtn" data-act="quit">${ICON.stop}FIN</button>`;
  }
  function updateCode(){
    const el = $('#codecard'); if(!el) return;
    const a = adminP();
    el.innerHTML = `<small>REJOINDRE</small><b>${esc(H.code)}</b>${a && a.conn ? `<span>Régie : ${esc(a.name)}</span>` : ''}`;
  }
  function renderGame(){
    const t = H.cur; if(!t) return;
    if(H.screen !== 'game' || H.drawnRound !== H.idx){
      H.drawnRound = H.idx; H.drawnRev = null; litDrawn = -1;
      show('game', `
        <div class="a g-badge grooves"><div class="a shine" style="inset:0;border-radius:50%"></div><div class="a lbl45 goldlabel"><small>MANCHE</small><b>${pad2(H.idx + 1)}</b><small>SUR ${H.tracks.length}</small></div></div>
        <div class="a g-sign signwrap">${signHTML('BLIND TEST', 46, 430, 76)}<div class="ribbon">${esc(H.playlist ? H.playlist.title : 'Blind test')}</div></div>
        <div class="a g-clock bezel" id="clock">
          <span class="cl-digits"><span class="ghost">88</span><span class="led" id="secs">30</span></span>
          <div class="cl-bar" id="clbar">${'<i class="on"></i>'.repeat(15)}</div>
          <div class="a screw goldlabel" style="left:5px;top:5px"></div><div class="a screw goldlabel" style="right:5px;top:5px"></div>
          <div class="a screw goldlabel" style="left:5px;bottom:5px"></div><div class="a screw goldlabel" style="right:5px;bottom:5px"></div>
        </div>
        <div class="a cab cabinet"><div class="cabin cabinner">
          <div class="glare"></div><div class="neon"></div>
          <div class="rec" id="rec"></div>
          <div class="board" id="board"></div>
        </div></div>
        <div id="lecs"></div>
        <div class="a ctrls" id="ctrl"></div>
        <div class="a codecard" id="codecard"></div>`);
    }
    const rev = H.phase === 'reveal';
    if(H.drawnRev !== rev){ H.drawnRev = rev; const r = $('#rec'); r.className = 'rec' + (rev ? ' rv' : ''); r.innerHTML = recHTML(t, rev); }
    $('#board').innerHTML = fieldHTML('artist') + fieldHTML('title');
    H.anim = {artist: false, title: false};
    updateLecterns(); updateCtrl(); updateCode();
    sendAdmin();
  }

  /* ---- Rendu : podium ---- */
  function renderEnd(){
    const r = ranked(); const w = r[0];
    stage.classList.remove('paused');
    const col = (p, place) => {
      if(!p) return `<div class="pcol empty p${place}"></div>`;
      const sc = pad2(p.score);
      return `<div class="pcol p${place}" style="--c:${p.color}">${place === 1 ? CROWN_SVG : ''}
        <div class="award a${place}"><div class="shine"></div>${avHTML(p)}</div>
        <b class="nm plate">${esc(p.name)}</b>
        <span class="ledbox"><span class="ghost">${'8'.repeat(sc.length)}</span><span class="led">${sc}</span></span>
        <div class="riser marquee"><div class="rf signface">${place}</div></div></div>`;
    };
    const signText = w ? w.name : 'Fin du show';
    const fs = Math.min(54, Math.floor(900 / (Math.max(6, signText.length) * .95)));
    show('end', `
      <div class="a e-sign signwrap">${signHTML(up(signText), fs, Math.min(960, Math.round(up(signText).length * fs * .82 + 100)), fs + 30)}<div class="ribbon">${w ? 'REMPORTE LE DISQUE D’OR' : 'MERCI D’AVOIR JOUÉ'}</div></div>
      <div class="a podium">${col(r[1], 2)}${col(r[0], 1)}${col(r[2], 3)}</div>
      ${r.length > 3 ? `<div class="a others">${r.slice(3, 10).map((p, i) => `<div class="oth"><span>${i + 4}</span><b>${esc(p.name)}</b><s>${p.score}</s></div>`).join('')}</div>` : ''}
      <div class="a ctrls"><button class="cbtn gold" data-act="lobby">${ICON.play}REJOUER</button></div>`);
    sendAdmin();
  }

  /* ---- Chrono ---- */
  let litDrawn = -1;
  (function tick(){
    if(H.screen === 'game'){
      const d = H.audio.duration || 30, ct = H.audio.currentTime || 0;
      const s = $('#secs');
      if(s){
        const left = H.phase === 'playing' ? Math.max(0, Math.ceil(d - ct)) : 0;
        const txt = left < 100 ? pad2(left) : fmt(left);
        if(s.textContent !== txt){ s.textContent = txt; s.previousElementSibling.textContent = txt.replace(/\d/g, '8'); }
        const lit = H.phase === 'playing' ? Math.ceil(Math.max(0, d - ct) / d * 15) : 0;
        if(lit !== litDrawn){ litDrawn = lit; document.querySelectorAll('#clbar i').forEach((el, i) => el.classList.toggle('on', i < lit)); }
        const c = $('#clock'); if(c) c.classList.toggle('low', H.phase === 'playing' && left <= 5 && !H.audio.paused);
      }
    } else litDrawn = -1;
    requestAnimationFrame(tick);
  })();

  /* ---- Actions ---- */
  const ACT = {
    preset: d => { const q = $('#q'); if(q) q.value = d.q; search(d.q); },
    pick: d => pick(d.id),
    setn: d => { H.n = +d.n; updateOpts(); sendAdmin(); },
    setord: d => { H.order = d.o === 'playlist' ? 'playlist' : 'random'; store('bt-order', H.order); updateOpts(); sendAdmin(); },
    start: () => startGame(),
    next,
    quit: endGame,
    lobby: backToLobby,
    freeadmin: freeAdmin,
    pause: () => {
      if(H.phase !== 'playing' && H.phase !== 'reveal') return;
      if(H.audio.paused){ H.audio.play().catch(() => {}); if(H.phase === 'reveal' && H.auto){ clearTimeout(H.nextTO); H.nextTO = setTimeout(next, 8000); } }
      else { H.audio.pause(); clearTimeout(H.nextTO); }
    },
    give: d => {
      const f = H.feed.find(x => x.id == d.i); if(!f) return;
      const field = d.f === 'artist' ? 'artist' : 'title';
      const p = H.players.get(f.key);
      if(award(p, field)){ f.got.push(field); renderGame(); broadcast(); }
    }
  };
  document.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if(a && !a.disabled && ACT[a.dataset.act]) ACT[a.dataset.act](a.dataset); });
  document.addEventListener('change', e => {
    if(e.target.id === 'auto'){ H.auto = e.target.checked; sendAdmin(); }
    if(e.target.id === 'hint'){ H.hint = e.target.checked; store('bt-hint', H.hint ? '1' : '0'); sendAdmin(); }
  });
  document.addEventListener('keydown', e => {
    if(e.target.matches('input,select')) return;
    if(H.phase !== 'playing' && H.phase !== 'reveal') return;
    if(e.code === 'Space'){ e.preventDefault(); ACT.pause(); }
    if(e.key === 'ArrowRight' || e.key.toLowerCase() === 'n'){ e.preventDefault(); next(); }
  });

  connectPeer();
  renderLobby();
}

/* =====================================================================
   TÉLÉPHONE : JOUEUR OU ANIMATEUR
   ===================================================================== */
function playerMain(){
  document.body.classList.add('ph');
  document.body.insertAdjacentHTML('afterbegin', '<div class="ph-bg"><div class="rays"></div><div class="vignette"></div></div>');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const saved = storeJSON('bt-av');
  const P = {
    name: store('bt-name') || '', lang: store('bt-lang') || 'fr-FR',
    avatar: saved && isWikiImg(saved.url) ? saved : null,
    faces: storeJSON('bt-faces') || {}, extra: [],
    role: 'player', plays: true,
    peer: null, conn: null, state: null, adm: null, admView: '', admRound: 0, showAns: false,
    rec: null, listening: false, retry: 0, deadline: null
  };
  let fx = null;

  /* ---- Photos des personnalités (Wikipédia en français) ---- */
  async function faceFor(title){
    if(P.faces[title] !== undefined) return P.faces[title];
    let url = null;
    try{
      const r = await fetch('https://fr.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title.replace(/ /g, '_')));
      if(r.ok){ const j = await r.json(); url = j.thumbnail && j.thumbnail.source || null; }
    }catch(e){}
    if(!url) url = (await searchFace(title) || {}).url || null;
    if(url && !isWikiImg(url)) url = null;
    P.faces[title] = url; storeJSON('bt-faces', P.faces);
    return url;
  }
  async function searchFace(q){
    try{
      const r = await fetch('https://fr.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=1&gsrsearch=' + encodeURIComponent(q) + '&prop=pageimages&piprop=thumbnail&pithumbsize=320');
      const j = await r.json();
      const pg = j.query && j.query.pages && Object.values(j.query.pages)[0];
      if(pg && pg.thumbnail && isWikiImg(pg.thumbnail.source)) return {name: pg.title, url: pg.thumbnail.source};
    }catch(e){}
    return null;
  }
  function faceBtn(name, url, loading){
    const sel = P.avatar && P.avatar.url === url && url;
    return `<button type="button" class="face ${sel ? 'sel' : ''} ${loading ? 'load' : ''}" data-face="${esc(name)}" ${url ? '' : 'disabled'} aria-pressed="${sel ? 'true' : 'false'}">${url ? `<img src="${esc(url)}" alt="" referrerpolicy="no-referrer" loading="lazy">` : '<span class="ph"></span>'}<span>${esc(name)}</span></button>`;
  }
  function drawFaces(){
    const box = $('#faces'); if(!box) return;
    const list = P.extra.concat(STARS.map(n => ({name: n, url: P.faces[n]})));
    box.innerHTML = list.filter(f => f.url !== null).map(f => faceBtn(f.name, f.url, f.url === undefined)).join('');
  }
  function loadFaces(){
    drawFaces();
    let i = 0;
    const worker = async () => { while(i < STARS.length){ const n = STARS[i++]; if(P.faces[n] === undefined){ await faceFor(n); drawFaces(); } } };
    for(let k = 0; k < 6; k++) worker();
  }

  function renderJoin(msg){
    app.innerHTML = `
    <div class="phone">
      <div class="signwrap">${signHTML('BLIND TEST', 30, 262, 50, 14)}<div class="ribbon">PARTIE ${esc(ROOM)}</div></div>
      <label class="fld"><span class="plaque">TON PRÉNOM</span><input class="inp" id="nm" maxlength="16" placeholder="Ton prénom" value="${esc(P.name)}" autocomplete="nickname"></label>
      <div><span class="plaque">CHOISIS TA TÊTE</span></div>
      <div class="faces" id="faces"></div>
      <form id="cf" class="row"><input class="inp" id="cq" placeholder="Une autre personnalité…" autocomplete="off" aria-label="Chercher une personnalité"><button class="btn-gold">CHERCHER</button></form>
      <div class="roles">
        <button type="button" id="bp" class="btn-buzz">JOUER</button>
        <button type="button" id="ba" class="btn-ghost">ANIMER LA PARTIE</button>
        <label class="sw"><input type="checkbox" id="ap">L’animateur joue aussi</label>
      </div>
      ${msg ? `<p class="warn">${esc(msg)}</p>` : ''}
      ${SR ? '' : '<p class="warn">La reconnaissance vocale n’est pas disponible sur ce navigateur : tu pourras répondre au clavier. Sur iPhone, utilise Safari ; sur Android, Chrome.</p>'}
      <p class="note">L’animateur choisit la playlist, lance la partie, passe les chansons et valide les réponses mal comprises. Une seule personne peut animer.</p>
    </div>`;
    lights(app);
    if(P.avatar && !STARS.includes(P.avatar.name) && !P.extra.some(f => f.url === P.avatar.url)) P.extra.unshift(P.avatar);
    loadFaces();
    $('#faces').onclick = e => {
      const b = e.target.closest('[data-face]'); if(!b || b.disabled) return;
      const name = b.dataset.face;
      const f = P.extra.find(x => x.name === name);
      const url = f ? f.url : P.faces[name];
      if(!url) return;
      P.avatar = {name, url}; storeJSON('bt-av', P.avatar); drawFaces();
    };
    $('#cf').onsubmit = async e => {
      e.preventDefault(); const q = $('#cq').value.trim(); if(!q) return;
      const btn = e.target.querySelector('button'); btn.disabled = true; btn.textContent = '…';
      const f = await searchFace(q);
      btn.disabled = false; btn.textContent = 'CHERCHER';
      if(!f){ $('#cq').value = ''; $('#cq').placeholder = 'Pas de photo trouvée, essaie un autre nom'; return; }
      P.extra = [f].concat(P.extra.filter(x => x.url !== f.url));
      P.avatar = f; storeJSON('bt-av', f); $('#cq').value = ''; drawFaces();
      $('#faces').scrollTop = 0;
    };
    const go = role => {
      const n = $('#nm').value.trim(); if(!n) return $('#nm').focus();
      P.name = n; store('bt-name', n);
      P.role = role; P.plays = role === 'player' ? true : $('#ap').checked;
      P.retry = 0; P.admView = ''; P.adm = null; P.state = null;
      renderShell(); connect(); keepAwake();
    };
    $('#bp').onclick = () => go('player');
    $('#ba').onclick = () => go('admin');
    $('#nm').onkeydown = e => { if(e.key === 'Enter') go('player'); };
  }

  function connect(){
    setStatus('<div class="stmsg"><span>Connexion à la partie…</span></div>');
    if(P.peer) try{ P.peer.destroy(); }catch(e){}
    const peer = new Peer({debug: 0}); P.peer = peer;
    peer.on('open', () => {
      const c = peer.connect(PREFIX + ROOM, {reliable: true}); P.conn = c;
      c.on('open', () => { P.retry = 0; c.send({t: 'hello', name: P.name, role: P.role, plays: P.plays, avatar: P.avatar && P.avatar.url, avName: P.avatar && P.avatar.name}); });
      c.on('data', onData);
      c.on('close', () => { if(P.peer === peer) reconnect(); });
    });
    peer.on('error', e => {
      if(P.peer !== peer) return;
      if(e.type === 'peer-unavailable'){ stopPeer(); return renderJoin('Partie « ' + ROOM + ' » introuvable. Vérifie le code affiché sur la TV, ou rescanne le QR code.'); }
      reconnect();
    });
  }
  function stopPeer(){ const p = P.peer; P.peer = null; try{ p && p.destroy(); }catch(e){} }
  function reconnect(){
    if(P.retry > 8){ stopPeer(); return renderJoin('Connexion perdue. Rejoins à nouveau.'); }
    P.retry++; setStatus('<div class="stmsg"><span>Reconnexion…</span></div>');
    setTimeout(() => { if(P.peer) connect(); }, 1500);
  }
  function onData(d){
    if(!d || typeof d !== 'object') return;
    if(d.t === 'state') onState(d);
    else if(d.t === 'admin') onAdmin(d);
    else if(d.t === 'denied'){ stopPeer(); renderJoin('« ' + d.who + ' » anime déjà la partie. Rejoins comme joueur, ou demande qu’on le retire depuis la TV.'); }
    else if(d.t === 'revoked'){ P.role = 'player'; P.plays = true; P.admView = ''; P.adm = null; renderShell(); }
  }
  function cmd(o){ if(P.conn && P.conn.open) try{ P.conn.send(Object.assign({t: 'cmd'}, o)); }catch(e){} }

  const micIdle = () => `${ICON.mic}<span>APPUIE &amp;<br>CHANTE</span>`;
  function plecHTML(bump){
    const s = P.state; const isAdm = P.role === 'admin';
    const color = (s && okColor(s.color)) || '#FF6FA8';
    const rank = s && s.count > 1 && s.rank > 0 ? `${s.rank}${s.rank === 1 ? 'er' : 'e'} sur ${s.count} joueurs` : (isAdm ? 'Animateur' : (P.avatar ? P.avatar.name : 'Candidat'));
    const sc = pad2(s ? s.score : 0);
    return `<div class="lip"></div><div class="p-panel panel">${avHTML({name: P.name, avatar: P.avatar && P.avatar.url, color})}<div class="who"><b class="nm plate">${esc(P.name)}</b><small>${esc(rank)}</small></div>${P.plays ? `<span class="ledbox${bump ? ' bump' : ''}"><span class="ghost">${'8'.repeat(sc.length)}</span><span class="led">${sc}</span></span>` : ''}${isAdm ? '<span class="regie-tag">RÉGIE</span>' : ''}</div>`;
  }
  function renderShell(){
    const isAdm = P.role === 'admin';
    app.innerHTML = `
    <div class="phone">
      <div class="p-lec" id="plec">${plecHTML()}</div>
      ${isAdm ? '<section class="regie" id="adm"><span class="note">Connexion…</span></section>' : ''}
      ${P.plays || !isAdm ? `
      <section class="mini cabinet" id="mini"><div class="cabin cabinner"><div class="glare a" style="inset:0;border-radius:inherit"></div><div class="neon"></div><div class="st" id="st"></div></div></section>
      <div class="buzz ${isAdm ? 'sm' : ''}">
        <button class="dome-btn" id="mic" ${SR ? '' : 'disabled'} aria-label="Appuie et chante ta réponse">${SR ? micIdle() : '<span>MICRO<br>INDISPONIBLE</span>'}</button>
        <div class="lip blip"></div>
        <div class="plinth"><span id="pround">EN ATTENTE</span><span class="led" id="pchrono"></span></div>
      </div>
      <div class="said" id="heard"></div>
      ${SR ? `<div class="langs"><span>MICRO</span><div class="seg"><button type="button" data-l="fr-FR" class="${P.lang === 'fr-FR' ? 'on' : ''}">FRANÇAIS</button><button type="button" data-l="en-US" class="${P.lang === 'en-US' ? 'on' : ''}">ENGLISH</button></div></div>` : ''}
      <form id="tf" class="row"><input class="inp" id="tx" placeholder="Ou tape ta réponse" autocomplete="off" aria-label="Ta réponse"><button class="btn-gold">ENVOYER</button></form>` : ''}
    </div>`;
    if(!fx) fx = makeFX();
    const mic = $('#mic');
    if(mic) mic.onclick = () => P.listening ? stopListening() : startListening();
    document.querySelectorAll('[data-l]').forEach(b => b.onclick = () => {
      P.lang = b.dataset.l; store('bt-lang', P.lang);
      document.querySelectorAll('[data-l]').forEach(x => x.className = x.dataset.l === P.lang ? 'on' : '');
    });
    const tf = $('#tf');
    if(tf) tf.onsubmit = e => {
      e.preventDefault(); const v = $('#tx').value.trim(); if(!v) return;
      send(v, [], true); setHeard('<em>Tu dis</em> « ' + esc(v) + ' »'); $('#tx').value = '';
    };
    if(P.state) onState(P.state, true);
    if(P.adm) onAdmin(P.adm);
  }
  function setStatus(html){ const el = $('#st'); if(el) el.innerHTML = html; }
  function setHeard(html, err){ const h = $('#heard'); if(h){ h.innerHTML = html; h.classList.toggle('err', !!err); } }

  /* ---- Chrono local (le téléphone décompte à partir du temps restant envoyé par la TV) ---- */
  setInterval(() => {
    const el = $('#pchrono'); if(!el) return;
    const s = P.state; let txt = '';
    if(s && s.phase === 'playing'){
      if(s.paused) txt = 'PAUSE';
      else if(P.deadline) txt = fmt(Math.max(0, Math.ceil((P.deadline - Date.now()) / 1000)));
      else if(s.left != null) txt = fmt(s.left);
    }
    if(el.textContent !== txt) el.textContent = txt;
  }, 250);

  function miniFields(s, prev){
    const st = $('#st'); const W = Math.max(200, (st ? st.clientWidth : 300));
    let html = '';
    if(s.phase === 'reveal' && s.reveal) html += `<div class="mrev">${s.reveal.cover ? `<img src="${esc(s.reveal.cover)}" alt="">` : ''}<span class="plaque sm">C’ÉTAIT…</span></div>`;
    for(const f of ['artist', 'title']){
      const fs = s.board && s.board[f]; if(!fs) continue;
      const was = prev && prev.round === s.round && prev.board && prev.board[f] && prev.board[f].shown;
      const chip = fs.by ? `<span class="chip ok sm">${fs.by === s.me ? 'toi !' : esc(fs.by)}</span>`
        : (fs.shown ? '<span class="chip none sm">personne</span>' : '<span class="take">À PRENDRE !</span>');
      const body = fs.text ? tilesHTML(fs.text, {maxW: W, maxH: 46, max: 30, anim: fs.shown && !was}) : mysHTML(true);
      html += `<div class="mf"><div class="mh"><span class="plaque sm">${f === 'artist' ? 'ARTISTE' : 'TITRE'}</span>${chip}</div><div class="mb">${body}</div></div>`;
    }
    return html;
  }
  function onState(s, redraw){
    const prev = redraw ? null : P.state; P.state = s;
    const bump = prev && s.score > prev.score;
    const pl = $('#plec'); if(pl) pl.innerHTML = plecHTML(bump);
    P.deadline = s.phase === 'playing' && !s.paused && s.left != null ? Date.now() + s.left * 1000 : null;
    const pr = $('#pround');
    if(pr) pr.textContent = s.phase === 'lobby' ? 'EN ATTENTE' : s.phase === 'end' ? 'FIN DU SHOW' : `MANCHE ${pad2(s.round)}/${s.total}`;
    if(!$('#st')) return;
    const mine = k => s.found[k] === s.me;
    if(prev && prev.phase === 'playing' && s.phase === 'playing' && ((mine('artist') && prev.found.artist !== s.me) || (mine('title') && prev.found.title !== s.me))){
      try{ navigator.vibrate && navigator.vibrate([60, 40, 120]); }catch(e){}
      const m = $('#mini'); if(m){ m.classList.remove('flash'); void m.offsetWidth; m.classList.add('flash'); }
      if(fx) fx.burst(60, .5, .35);
    }
    if(s.phase === 'playing' && prev && prev.round !== s.round) setHeard('');
    if(s.phase === 'end' && prev && prev.phase !== 'end' && s.rank === 1 && fx) fx.rain(3500);
    if(s.phase === 'lobby') setStatus(P.role === 'admin'
      ? '<div class="stmsg"><b>PRÊT !</b><span>Teste ton micro : ta phrase s’affiche sur la TV.</span></div>'
      : '<div class="stmsg"><b>TU ES SUR LE PLATEAU !</b><span>En attente du lancement. Teste ton micro : ta phrase s’affiche sur la TV.</span></div>');
    else if(s.phase === 'playing' || s.phase === 'reveal') setStatus(miniFields(s, prev));
    else if(s.phase === 'end') setStatus(`<div class="stmsg"><b>FIN DU SHOW !</b><span>Tu finis ${s.rank}${s.rank === 1 ? 'er' : 'e'} avec ${s.score} point${s.score > 1 ? 's' : ''}${s.rank === 1 ? ' : disque d’or !' : '.'}</span></div>`);
  }

  /* ---- Panneau animateur (régie) ---- */
  function aoptsHTML(a){
    return `<div class="grp"><span class="olbl">CHANSONS</span><div class="seg">${[10, 15, 20, 30].map(n => `<button type="button" class="${n === a.n ? 'on' : ''}" data-c="set" data-n="${n}">${n}</button>`).join('')}</div></div>
      <div class="grp"><span class="olbl">ORDRE</span><div class="seg"><button type="button" class="${a.order !== 'playlist' ? 'on' : ''}" data-c="set" data-order="random">HASARD</button><button type="button" class="${a.order === 'playlist' ? 'on' : ''}" data-c="set" data-order="playlist">PLAYLIST</button></div></div>
      <label class="sw"><input type="checkbox" id="aauto" ${a.auto ? 'checked' : ''}>Enchaîner auto</label>
      <label class="sw"><input type="checkbox" id="ahint" ${a.hint ? 'checked' : ''}>Indice : nombre de lettres</label>`;
  }
  function onAdmin(a){
    P.adm = a;
    const box = $('#adm'); if(!box) return;
    const warn = a.unlocked ? '' : '<div class="warn">Touche une fois l’écran de la TV pour y activer le son.</div>';
    if(a.phase === 'lobby'){
      if(P.admView !== 'lobby'){
        P.admView = 'lobby';
        box.innerHTML = `
          <div class="rh"><span class="plaque">RÉGIE</span><b>PRÉPARER LE SHOW</b></div>
          <div id="awarn"></div>
          <form id="as" class="row"><input class="inp" id="aq" placeholder="Thème, ou lien Deezer" value="${esc(a.q || '')}" aria-label="Rechercher une playlist"><button class="btn-gold">OK</button></form>
          <div class="strips">${PRESETS.map((p, i) => `<button type="button" class="strip" data-c="search" data-q="${esc(p)}"><b>${'AB'[Math.floor(i / 5)]}${i % 5 + 1}</b><span>${esc(p)}</span></button>`).join('')}</div>
          <div class="ares" id="ares"></div>
          <div id="achosen" class="chosen"></div>
          <div class="aopts" id="aopts"></div>
          <button id="astart" class="btn-launch wide">LANCER LE SHOW</button>
          <div id="aplayers" class="note"></div>`;
        $('#as').onsubmit = e => {
          e.preventDefault(); const q = $('#aq').value.trim(); if(!q) return;
          const m = q.match(/playlist\/(\d+)/) || q.match(/^(\d{4,})$/);
          cmd(m ? {c: 'pick', id: m[1]} : {c: 'search', q});
        };
        $('#astart').onclick = () => cmd({c: 'start'});
      }
      $('#awarn').innerHTML = warn;
      const r = a.results;
      $('#ares').innerHTML = r === null || r === undefined ? '<span class="note">Choisis un thème, ou lance une recherche.</span>'
        : r === 'loading' ? '<span class="note">Recherche…</span>'
        : typeof r === 'string' ? `<span class="warn">${esc(r)}</span>`
        : !r.length ? '<span class="note">Aucun résultat.</span>'
        : r.map(x => `<button type="button" class="${a.playlist && a.playlist.id == x.id ? 'sel' : ''}" data-c="pick" data-id="${esc(x.id)}"><img src="${esc(x.pic)}" alt=""><span style="flex:1"><b>${esc(x.title)}</b><span>${esc(x.nb)} titres</span></span></button>`).join('');
      $('#achosen').innerHTML = a.loading ? `<span class="muted">${esc(a.loading)}</span>`
        : a.playlist ? `<span class="ok">✓</span> ${esc(a.playlist.title)} <span class="muted">· ${a.playlist.count} extraits</span>` : '<span class="muted">Aucune playlist choisie</span>';
      $('#aopts').innerHTML = aoptsHTML(a);
      $('#astart').disabled = !a.playlist || !!a.loading;
      $('#aplayers').textContent = a.players && a.players.length ? 'Candidats : ' + a.players.map(p => p.name).join(', ') : 'Aucun candidat pour l’instant.';
      return;
    }
    if(a.phase === 'end'){
      P.admView = 'end';
      box.innerHTML = `<div class="rh"><span class="plaque">RÉGIE</span><b>FIN DU SHOW</b></div>${playersHTML(a, false)}<button class="btn-launch wide" data-c="lobby">NOUVELLE PARTIE</button>`;
      return;
    }
    // manche en cours ou révélation
    if(P.admRound !== a.round){ P.admRound = a.round; P.showAns = false; }
    P.admView = 'game';
    const rev = a.phase === 'reveal';
    const t = a.track || {};
    const showAns = rev || P.showAns || !P.plays;
    const found = k => a.found && a.found[k] ? `<b>✓ ${esc(a.found[k])}</b>` : '…';
    box.innerHTML = `
      <div class="rh"><span class="plaque">RÉGIE</span><b>MANCHE ${pad2(a.round)}/${a.total}</b><small>${a.paused ? 'en pause' : ''}</small></div>
      ${warn}
      <div class="ans">${showAns
        ? `${t.cover ? `<img src="${esc(t.cover)}" alt="">` : ''}<div><b>${esc(t.title)}</b><br><span>${esc(t.artist)}</span></div>`
        : '<button type="button" class="btn-ghost" data-c="__ans">VOIR LA RÉPONSE</button>'}</div>
      <div class="found">Artiste ${found('artist')} · Titre ${found('title')}</div>
      <div class="abtns">
        <button type="button" class="btn-ghost" data-c="pause">${a.paused ? 'REPRENDRE' : 'PAUSE'}</button>
        <button type="button" class="btn-gold" data-c="next">${rev ? (a.round >= a.total ? 'RÉSULTATS' : 'SUIVANT') : 'RÉVÉLER'}</button>
      </div>
      ${a.feed && a.feed.length ? '<div class="afeed">' + a.feed.map(f => `<div><b>${esc(f.name)}</b><q>${esc(f.text)}</q>${f.got.length
          ? f.got.map(g => `<span class="tag">${g === 'artist' ? 'artiste' : 'titre'} ✓</span>`).join('')
          : (f.near ? '<span class="tag near">presque</span>' : '') + (!rev ? ['artist', 'title'].filter(k => !(a.found && a.found[k])).map(k => `<button type="button" class="give" data-c="give" data-i="${f.id}" data-f="${k}">+ ${k === 'artist' ? 'ARTISTE' : 'TITRE'}</button>`).join('') : '')}</div>`).join('') + '</div>' : ''}
      ${playersHTML(a, true)}
      <button type="button" class="btn-ghost" data-c="quit">TERMINER LA PARTIE</button>`;
  }
  function playersHTML(a, edit){
    if(!a.players || !a.players.length) return '';
    return '<div class="aplayers">' + a.players.map((p, i) => `<div class="${p.on ? '' : 'off'}"><span class="note">${i + 1}</span>${avHTML(p)}<b>${esc(p.name)}</b>${edit ? `<button type="button" data-c="score" data-key="${esc(p.key)}" data-d="-1" aria-label="Retirer un point">−</button>` : ''}<s>${p.score}</s>${edit ? `<button type="button" data-c="score" data-key="${esc(p.key)}" data-d="1" aria-label="Ajouter un point">+</button>` : ''}</div>`).join('') + '</div>';
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-c]'); if(!b || b.disabled) return;
    const d = b.dataset;
    if(d.c === '__ans'){ P.showAns = true; if(P.adm) onAdmin(P.adm); return; }
    if(d.c === 'quit' && !confirm('Terminer la partie maintenant ?')) return;
    const o = {c: d.c};
    if(d.q) o.q = d.q; if(d.id) o.id = d.id; if(d.i) o.i = d.i; if(d.f) o.f = d.f; if(d.key) o.key = d.key; if(d.d) o.d = +d.d;
    if(d.n) o.n = +d.n; if(d.order) o.order = d.order;
    if(d.c === 'search'){ const aq = $('#aq'); if(aq) aq.value = d.q; }
    cmd(o);
  });
  document.addEventListener('change', e => {
    if(e.target.id === 'aauto') cmd({c: 'set', auto: e.target.checked});
    if(e.target.id === 'ahint') cmd({c: 'set', hint: e.target.checked});
  });

  /* ---- Micro ---- */
  function send(text, alts, final){
    if(P.conn && P.conn.open) try{ P.conn.send({t: 'answer', text, alts, final}); }catch(e){}
  }
  function micIdleBtn(m){ m.classList.remove('on'); m.innerHTML = micIdle(); }
  function startListening(){
    if(!SR || P.listening) return;
    let rec;
    try{ rec = new SR(); }catch(e){ return; }
    P.rec = rec; rec.lang = P.lang; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 5;
    let lastSent = '', sentFinal = false;
    rec.onresult = e => {
      let text = ''; const alts = []; let final = false;
      for(let i = 0; i < e.results.length; i++){
        const r = e.results[i]; text += r[0].transcript;
        if(r.isFinal) final = true;
        for(let j = 1; j < r.length; j++) alts.push(r[j].transcript);
      }
      text = text.trim(); if(!text) return;
      setHeard('<em>Tu dis</em> « ' + esc(text) + ' »');
      if(final){ sentFinal = true; send(text, alts, true); }
      else if(text !== lastSent){ lastSent = text; send(text, alts, false); }
    };
    rec.onerror = e => {
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed') setHeard('Micro refusé : autorise-le dans les réglages du navigateur (et active Siri / Dictée sur iPhone).', true);
      else if(e.error === 'no-speech') setHeard('Je n’ai rien entendu, réessaie.', true);
    };
    rec.onend = () => {
      if(!sentFinal && lastSent) send(lastSent, [], true);
      P.listening = false; const m = $('#mic'); if(m) micIdleBtn(m);
    };
    try{ rec.start(); }catch(e){ return; }
    P.listening = true; const m = $('#mic'); if(m){ m.classList.add('on'); m.innerHTML = `${ICON.ear}<span>JE T’ÉCOUTE…</span>`; }
  }
  function stopListening(){ try{ P.rec && P.rec.stop(); }catch(e){} }

  renderJoin();
}
</script>
</body>
</html>
