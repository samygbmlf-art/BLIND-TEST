<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C0414">
<title>Blind Test — Le Grand Plateau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Inline&family=Barlow+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --ink:#0C0414; --cream:#FFF1C4; --paper:#FFFBEE; --gold:#FFC23D; --gold-d:#C8901E; --brass:#D9A23A;
  --red:#B3122A; --red-d:#8E0F1E; --red-dd:#5E0715; --teal:#2FD6BE; --led:#FF5A36; --sand:#D9B98A; --pink:#FF4B6E;
  --display:'Bungee',system-ui,sans-serif; --inline:'Bungee Inline','Bungee',system-ui,sans-serif;
  --body:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:#08030D;color:var(--cream);font-family:var(--body);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
input{font:inherit}
img{display:block}
.a{position:absolute}
svg{display:block}

/* ---------- Matières ---------- */
.rays{background:repeating-conic-gradient(from 0deg at 50% 44%,#220E3A 0deg 5deg,#170829 5deg 10deg)}
.vignette{background:radial-gradient(ellipse 72% 68% at 50% 42%,#08030D00 0%,#08030DA0 72%,#08030D 100%)}
.halo{background:radial-gradient(ellipse at 50% 50%,#FFC23D26 0%,#FFC23D00 62%)}
.beam{background:linear-gradient(180deg,#FFF3D0 0%,#FFF3D000 92%);clip-path:polygon(47% 0,53% 0,100% 100%,0 100%)}
.curtain-l{background:linear-gradient(90deg,#00000000 55%,#00000080),repeating-linear-gradient(90deg,#4E0612 0,#8E0F1E 9px,#C8213B 15px,#E0435A 17px,#C8213B 19px,#8E0F1E 26px,#4E0612 34px);clip-path:polygon(0 0,100% 0,96% 18%,84% 38%,62% 58%,58% 63%,66% 74%,82% 100%,0 100%)}
.curtain-r{background:linear-gradient(270deg,#00000000 55%,#00000080),repeating-linear-gradient(270deg,#4E0612 0,#8E0F1E 9px,#C8213B 15px,#E0435A 17px,#C8213B 19px,#8E0F1E 26px,#4E0612 34px);clip-path:polygon(100% 0,0 0,4% 18%,16% 38%,38% 58%,42% 63%,34% 74%,18% 100%,100% 100%)}
.pelmet{background:linear-gradient(180deg,#5E0715,#B3122A 55%,#7A0C1E);border-bottom:2px solid var(--gold)}
.swags{background-image:radial-gradient(ellipse 50% 100% at 50% 0,#9E1426 0 92%,#FFC23D 93% 100%,#00000000 100%);background-size:64px 22px;background-repeat:repeat-x}
.rope{background:linear-gradient(180deg,#FFF0B8,#D9A23A 50%,#8A5A10)}
.tassel{background:repeating-linear-gradient(90deg,#FFE38E 0 2px,#B07A1C 2px 4px)}
.floor{background:linear-gradient(180deg,#26103C 0%,#0E0618 42%,#050208 100%)}
.leds{background-image:radial-gradient(circle,#FFD25A 0 2px,#FFD25A00 3px);background-size:18px 8px;background-position:center}
.marquee{position:relative;background-color:#7A0C1E}
.bulb{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFFDF2,#FFE07A 45%,#E8A21E);box-shadow:0 0 4px #FFD25A,0 0 10px #FFC23D99;animation:bulb 1.2s steps(1) infinite;pointer-events:none}
.bulb:nth-child(even){animation-delay:-.6s}
@keyframes bulb{50%{background:radial-gradient(circle at 40% 35%,#E8C98A,#B3802E 60%,#7A5218);box-shadow:none}}
.signface{background:linear-gradient(180deg,#C41E36,#8E0F1E)}
.ribbon{background:linear-gradient(180deg,#FFF9E6,#EAD39A);clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%,5% 50%)}
.grooves{background:repeating-radial-gradient(circle,#0E0E10 0 1.6px,#222226 1.6px 3px)}
.shine{background:conic-gradient(from 30deg,#ffffff00 0 25deg,#ffffff26 50deg,#ffffff00 75deg 200deg,#ffffff1c 225deg,#ffffff00 250deg)}
.goldlabel{background:radial-gradient(circle at 40% 35%,#FFE9A6 0%,#FFC23D 45%,#C8861A 100%)}
.redlabel{background:radial-gradient(circle at 40% 35%,#E0435A 0%,#B3122A 50%,#6E0A1A 100%)}
.bezel{background:linear-gradient(180deg,#2A1420,#12060E)}
.vuface{background:radial-gradient(ellipse at 50% 115%,#FFF6D2 0%,#F6CF6E 55%,#D49A34 100%)}
.cabinet{background:linear-gradient(180deg,#FFF0B8 0%,#E0A93A 18%,#FFE38E 45%,#B07A1C 82%,#E8B44A 100%)}
.cabinner{background:radial-gradient(ellipse at 28% 50%,#3C1644 0%,#1C0A24 58%,#12061A 100%)}
.glare{background:linear-gradient(115deg,#FFFFFF12 0%,#FFFFFF05 28%,#FFFFFF00 29%);pointer-events:none}
.tube{background-image:radial-gradient(circle,#FFFFFF 0 1.6px,#FFFFFF00 2.4px),radial-gradient(circle,#FFFFFFAA 0 1.1px,#FFFFFF00 1.9px),linear-gradient(180deg,#FFE9A6,#FFC23D 45%,#E08A1E);background-size:16px 17px,16px 11px,100% 100%;background-position:3px 0,-4px 5px,0 0;border-radius:8px;box-shadow:0 0 16px #FFC23D99,inset 0 0 0 1px #FFFFFF60;animation:bubbles 2.4s linear infinite}
@keyframes bubbles{to{background-position:3px -68px,-4px -39px,0 0}}
.neon{position:absolute;pointer-events:none;border:3px solid #FFF4DA;box-shadow:0 0 2px #FFF4DA,0 0 6px #FFC23D,0 0 14px #FFB020,0 0 30px #FF9A1ACC,inset 0 0 2px #FFF4DA,inset 0 0 8px #FFC23D,inset 0 0 18px #FFB02066}
.neon-h{position:absolute;height:3px;border-radius:2px;background:#FFF4DA;box-shadow:0 0 2px #FFF4DA,0 0 6px #FFC23D,0 0 14px #FFB020,0 0 30px #FF9A1ACC}
.chrome{background:conic-gradient(from 0deg,#FFF0B8,#B07A1C 25%,#FFE38E 45%,#8A5A10 70%,#FFF0B8)}
.window{background:radial-gradient(circle,#FFB13D40 0%,#3C1644 70%)}
.silver{background:linear-gradient(90deg,#8D8A86,#F2EFEA 45%,#A8A49E)}
.plaque{display:inline-block;background:linear-gradient(180deg,#FFE9A6,#D9A23A);color:#3A2208;font-family:var(--body);font-size:13px;font-weight:800;letter-spacing:.22em;padding:3px 10px;border-radius:4px;box-shadow:inset 0 -1px 0 #8A5A10,0 2px 0 #00000066;white-space:nowrap}
.plaque.sm{font-size:11px;padding:2px 8px;letter-spacing:.2em}
.lip{background:linear-gradient(180deg,#FFF0B8,#D9A23A 50%,#8A5A10)}
.panel{background:linear-gradient(180deg,#D42A44 0%,#9E1426 45%,#5E0715 100%)}
.plate{background:linear-gradient(180deg,#FFFBEE,#EFD69A);color:var(--red-d);font-family:var(--display);font-weight:400;border-radius:5px;box-shadow:0 2px 0 #00000066;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ledbox{position:relative;display:inline-block;background:#0A0306;border-radius:6px;padding:0 12px;box-shadow:inset 0 2px 6px #000,0 0 0 1px #FFC23D44;font-family:var(--display);line-height:1.15}
.ledbox .ghost{position:absolute;left:12px;top:0;color:#FF5A3614}
.led{position:relative;color:var(--led);text-shadow:0 0 14px #FF4B2BCC,0 0 2px #FF4B2B;font-family:var(--display)}

/* Avatars */
.av{width:2.2em;height:2.2em;border-radius:50%;object-fit:cover;object-position:50% 18%;border:3px solid var(--c,#FFC23D);flex:none;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);color:#1A0B10;background:var(--c,#FFC23D);line-height:1}
img.av{background:#2A1430}
.av.xs{width:22px;height:22px;border-width:2px;font-size:11px}

/* Contrôles */
.btn-gold{background:linear-gradient(180deg,#FFF0B8,#D9A23A 50%,#8A5A10);color:#3A2208;border-radius:10px;padding:0 14px;min-height:40px;font-family:var(--display);font-size:13px;box-shadow:0 4px 0 #6A4208;white-space:nowrap}
.btn-gold:active{transform:translateY(2px);box-shadow:0 2px 0 #6A4208}
.btn-ghost{background:#1A0A22;border:1.5px solid #C8901E99;color:var(--cream);border-radius:12px;padding:10px 14px;font-family:var(--display);font-size:13px}
.btn-launch{border-radius:14px;padding:0 20px;font-family:var(--display);font-size:19px;line-height:1.1;color:#3A1208;background:linear-gradient(180deg,#FFF0B8,#FFC23D 40%,#D9971E);box-shadow:0 5px 0 #8A5A10,0 0 30px #FFC23D55}
.btn-launch:not(:disabled):active{transform:translateY(3px);box-shadow:0 2px 0 #8A5A10}
.btn-launch:disabled{filter:grayscale(.7);box-shadow:0 5px 0 #4A3A20}
.inp{height:42px;border-radius:10px;border:1.5px solid #C8901E88;background:#12061A;color:var(--cream);padding:0 12px;font-size:18px;min-width:0}
.inp::placeholder{color:#B39A7A}
.seg{display:inline-flex;background:#12061A;border:1.5px solid #C8901E66;border-radius:9px;padding:2px;gap:2px}
.seg button{padding:4px 9px;border-radius:7px;font-family:var(--display);font-size:11px;color:var(--sand)}
.seg button.on{background:linear-gradient(#FFF0B8,#D9A23A);color:#3A2208}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:16px;font-weight:700;white-space:nowrap;cursor:pointer;user-select:none;-webkit-user-select:none}
.sw input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:99px;background:#2A1430;border:1.5px solid #C8901E88;position:relative;cursor:pointer;flex:none;transition:background .2s,box-shadow .2s}
.sw input::after{content:"";position:absolute;left:2px;top:2px;width:17px;height:17px;border-radius:50%;background:#8A6A4A;transition:transform .2s,background .2s}
.sw input:checked{background:#5A3A08;border-color:var(--gold);box-shadow:0 0 12px #FFC23D66}
.sw input:checked::after{transform:translateX(18px);background:radial-gradient(circle at 35% 35%,#FFF8DE,#FFC23D)}
.strip{display:flex;align-items:center;gap:6px;height:29px;background:linear-gradient(#FFFBEE,#EFD69A);border-radius:4px;color:#3A1208;padding:0 6px 0 4px;text-align:left;box-shadow:0 2px 0 #0008;font-size:13px;font-weight:700;line-height:1.02;min-width:0}
.strip b{background:var(--red);color:var(--gold);font-family:var(--display);font-weight:400;font-size:10px;border-radius:3px;padding:2px 4px;flex:none}
.strip span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.strip.on{box-shadow:0 0 0 2px var(--teal),0 2px 0 #0008}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:2px 12px 2px 3px;font-size:16px;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden}
.chip.ok{background:#0E3C36;border:1.5px solid var(--teal);color:#CFFAF2}
.chip.none{background:#2A1020;border:1.5px solid #FF4B6E88;color:#FFC0CC;padding:2px 12px}
.chip.sm{font-size:13px;padding:1px 9px}
.warn{background:#3A2A05;color:#FFD98A;padding:8px 10px;border-radius:10px;font-size:15px;border:1px solid #FFC23D55}

/* Tuiles */
.tiles{display:flex;flex-direction:column;gap:calc(var(--tw)*.18)}
.tl{display:flex;gap:calc(var(--tw)*.4)}
.tw{display:flex;gap:calc(var(--tw)*.14)}
.t{width:var(--tw);height:calc(var(--tw)*1.29);border-radius:calc(var(--tw)*.15);display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--display);font-size:calc(var(--tw)*.7);line-height:1;flex:none}
.t.on{background:linear-gradient(180deg,#FFFBEE,#F2DCA2);color:#A3122A;box-shadow:inset 0 0 0 1px #FFFFFF99,inset 0 calc(var(--tw)*-.1) 0 #D9BC72,0 calc(var(--tw)*.1) 0 #00000088}
.t.off{background:linear-gradient(180deg,#3E1D58,#25103A);border:1px solid #7A4C96;color:#FFC23D80;font-family:var(--body);font-size:calc(var(--tw)*.46);box-shadow:inset 0 2px 0 #FFFFFF12,inset 0 -4px 0 #0A0410,0 calc(var(--tw)*.1) 0 #00000088}
.t.p{width:auto;min-width:calc(var(--tw)*.35);color:var(--cream);font-size:calc(var(--tw)*.6)}
.t.flip{animation:flip .55s cubic-bezier(.3,1.4,.5,1) both}
@keyframes flip{from{transform:perspective(300px) rotateX(-95deg);opacity:0}}
.mys{width:100%;height:78px;border-radius:7px;border:1px solid #7A4C96;background:linear-gradient(180deg,#3E1D58,#25103A);display:flex;align-items:center;justify-content:center;gap:18px;box-shadow:inset 0 2px 0 #FFFFFF12,inset 0 -4px 0 #0A0410,0 5px 0 #00000088;color:#FFC23D80;font-size:22px}
.mys b{font-family:var(--display);font-weight:400;font-size:38px;letter-spacing:.5em;margin-right:-.5em;color:#FFC23DB0}
.mys.sm{height:32px;border-radius:5px;gap:12px;font-size:12px}
.mys.sm b{font-size:15px}

/* =================== ÉCRAN TV =================== */
body.host{height:100vh;overflow:hidden}
#wrap{position:fixed;inset:0;overflow:hidden;background:#08030D}
.stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform:translate(-50%,-50%) scale(var(--s,1));overflow:hidden;background:#0C0414;color:var(--cream);font-family:var(--body)}
.scene{position:absolute;inset:0}
.stage .halo{left:160px;right:160px;top:120px;height:420px}
.stage .b1{left:120px;top:-40px;width:440px;height:820px;opacity:.12;transform:rotate(-26deg);transform-origin:50% 0}
.stage .b2{right:120px;top:-40px;width:440px;height:820px;opacity:.12;transform:rotate(26deg);transform-origin:50% 0}
.stage .b3{left:500px;top:0;width:280px;height:720px;opacity:.1}
.stage .floor{left:0;right:0;bottom:0;height:96px}
.stage .floorline{left:40px;right:40px;bottom:94px;height:3px;border-radius:2px;background:#FFF4DA;box-shadow:0 0 2px #FFF4DA,0 0 6px #FFC23D,0 0 14px #FFB020,0 0 30px #FF9A1ACC}
.stage .leds{left:150px;right:150px;bottom:74px;height:8px;opacity:.5}
.stage .curtain-l{left:0;top:0;width:84px;height:720px;clip-path:polygon(0 0,100% 0,92% 30%,72% 60%,80% 100%,0 100%)}
.stage .curtain-r{right:0;top:0;width:84px;height:720px;clip-path:polygon(100% 0,0 0,8% 30%,28% 60%,20% 100%,100% 100%)}
.stage .pelmet{left:0;right:0;top:0;height:26px;z-index:8}
.stage .swags{left:0;right:0;top:28px;height:22px;z-index:8}

.sign{display:inline-block;padding:12px;border-radius:84px 84px 18px 18px;box-shadow:0 0 0 2px var(--gold),0 16px 40px #000C,0 0 70px #FFC23D30}
.sign b{display:flex;align-items:center;justify-content:center;font-weight:400;border-radius:72px 72px 8px 8px;padding:0;box-shadow:inset 0 0 0 2px #FFC23DAA,inset 0 0 0 5px #8E0F1E,inset 0 0 0 6px #FFC23D44;font-family:var(--inline);font-size:54px;line-height:1;color:var(--gold);text-shadow:0 4px 0 #4E0612,0 0 26px #FFC23D55;white-space:nowrap}
.signwrap{display:flex;flex-direction:column;align-items:center}
.signwrap .ribbon{margin-top:-11px;position:relative;padding:6px 30px 5px;font-family:var(--display);font-size:14px;letter-spacing:.05em;color:var(--red-d);max-width:480px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}

/* Manche */
.g-badge{left:100px;top:52px;width:104px;height:104px;border-radius:50%;transform:rotate(-8deg);box-shadow:0 12px 26px #000C}
.g-badge .lbl45{left:22px;top:22px;width:60px;height:60px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#5A0812;line-height:1}
.lbl45 small{font-size:9px;font-weight:800;letter-spacing:.08em}
.lbl45 b{font-family:var(--display);font-weight:400;font-size:24px;margin:1px 0}
.g-sign{left:50%;top:50px;transform:translateX(-50%);z-index:2}
.g-clock{right:96px;top:52px;width:214px;padding:10px 14px 10px;border-radius:16px;box-shadow:0 0 0 3px #C8901E,0 0 0 5px #4A2E06,0 14px 30px #000C;display:flex;flex-direction:column;align-items:center;gap:5px}
.g-clock .cl-lbl{font-size:12px;font-weight:800;letter-spacing:.32em;color:var(--brass)}
.g-clock .cl-digits{position:relative;background:#0A0306;border-radius:9px;padding:0 20px;box-shadow:inset 0 2px 8px #000,0 0 0 1px #FFC23D44;font-family:var(--display);font-size:66px;line-height:1.05}
.g-clock .cl-digits .ghost{position:absolute;left:20px;top:0;color:#FF5A3612}
.g-clock .cl-bar{display:flex;gap:3px;width:100%}
.g-clock .cl-bar i{flex:1;height:8px;border-radius:2px;background:#2A1420;transition:background .3s,box-shadow .3s}
.g-clock .cl-bar i.on{background:var(--gold);box-shadow:0 0 6px #FFC23DAA}
.g-clock.low .cl-bar i.on{background:var(--led);box-shadow:0 0 6px var(--led)}
.g-clock.low .led{animation:blink .5s steps(2) infinite}
.g-clock .screw{width:5px;height:5px;border-radius:50%}

/* Juke-box */
.cab{left:90px;right:90px;top:162px;height:346px;padding:7px;border-radius:70px 70px 24px 24px;box-shadow:0 0 0 2px #4A2E06,0 28px 60px #000D,0 0 90px #FFC23D30}
.cabin{position:relative;height:100%;border-radius:64px 64px 18px 18px;display:flex;align-items:center;gap:36px;padding:0 50px 0 54px;box-shadow:inset 0 0 0 1px #FFE38E55,inset 0 10px 30px #000A}
.cabin .glare{position:absolute;inset:0;border-radius:inherit}
.cab .neon{inset:11px;border-radius:53px 53px 8px 8px}
.prog .neon{inset:8px;border-radius:26px 26px 9px 9px}
.mini .neon{inset:6px;border-radius:18px 18px 5px 5px}
.cabin .tube{position:absolute;top:66px;bottom:24px;width:16px}
.cabin .tube.l{left:14px}.cabin .tube.r{right:14px}
.rec{width:272px;height:272px;flex:none;position:relative}
.rec .ring{inset:0;border-radius:50%;box-shadow:0 10px 24px #000A}
.rec .win{inset:7px;border-radius:50%;box-shadow:inset 0 6px 20px #000C}
.rec .disc{inset:22px;border-radius:50%;box-shadow:0 6px 16px #000C}
.rec .dshine{inset:22px;border-radius:50%;pointer-events:none}
.rec .lbl{left:73px;top:73px;width:82px;height:82px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 0 0 2px #FFC23D88;overflow:hidden;transition:all .6s cubic-bezier(.3,1.3,.5,1)}
.rec .lbl small{font-size:9px;font-weight:800;letter-spacing:.2em;color:#FFD98A}
.rec .lbl b{font-family:var(--display);font-weight:400;font-size:36px;color:var(--gold)}
.rec .lbl img{width:100%;height:100%;object-fit:cover}
.rec.rv .lbl{left:38px;top:38px;width:152px;height:152px;box-shadow:0 0 0 3px var(--gold),0 0 30px #FFC23D88}
.rec .pivot{right:2px;top:2px;width:34px;height:34px;border-radius:50%;box-shadow:0 4px 10px #000A}
.rec .arm{right:15px;top:19px;width:8px;height:130px;transform-origin:50% 0;transform:rotate(26deg);transition:transform .8s cubic-bezier(.4,1.4,.5,1)}
.rec .arm i{display:block;width:8px;height:110px;border-radius:4px;box-shadow:0 4px 8px #0009}
.rec .arm u{display:block;width:16px;height:18px;margin-left:-4px;border-radius:3px}
.spin{animation:spin 1.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.paused .spin,.paused .tube,.paused .bulb{animation-play-state:paused}
.paused .rec .arm{transform:rotate(6deg)}
.board{position:relative;flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px}
.board .plaque{font-size:15px;padding:4px 12px}
.board .chip{font-size:18px}
.board .chip .av.xs{width:26px;height:26px}
.field .fhead{display:flex;align-items:center;gap:12px;height:30px;margin-bottom:8px}
.field .fbody{height:100px;display:flex;align-items:center}
.hintt{font-size:18px;font-weight:600;color:var(--sand)}

/* Pastille « Bravo » */
#sticker{right:122px;top:172px;width:160px;height:160px;z-index:15;pointer-events:none;opacity:0;filter:drop-shadow(0 10px 12px #000A)}
#sticker svg{position:absolute;inset:0}
#sticker .stk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#5A0812;line-height:1;text-align:center;gap:2px}
#sticker .stk .av{width:34px;height:34px;border:2px solid #7A0C1E;font-size:15px;margin-bottom:2px}
#sticker small{font-family:var(--display);font-size:12px}

/* =====================================================================

/* Avatar : photo de la personnalité, ou initiale sur pastille colorée */
function avHTML(p, cls){
  cls = cls || '';

  const style = `style="--c:${okColor(p.color) || '#FFC23D'}"`;
  return isWikiImg(p.avatar)
    ? `<img class="av ${cls}" ${style} src="${esc(p.avatar)}" alt="" referrerpolicy="no-referrer" loading="lazy">`
    : `<span class="av ${cls}" ${style}>${esc(String(p.name || '?').trim().charAt(0).toUpperCase() || '?')}</span>`;
}
const signHTML = (text, fs, w, h, sp) => `<div class="sign marquee" data-sp="${sp || 18}"><b class="signface" style="font-size:${fs}px;width:${w}px;height:${h}px">${esc(text)}</b></div>`;
/* Ampoules réparties à intervalle régulier sur le cadre (suit les coins arrondis) */
function placeBulbs(el){
  const w = el.offsetWidth, h = el.offsetHeight; if(!w || !h) return;
  const key = w + 'x' + h; if(el.dataset.lit === key) return; el.dataset.lit = key;
  el.querySelectorAll(':scope > .bulb').forEach(b => b.remove());
  const cs = getComputedStyle(el); const d = (parseFloat(cs.paddingTop) || 12) / 2;
  const W = w - 2 * d, Hh = h - 2 * d;
  const [tl, tr, br, bl] = ['borderTopLeftRadius', 'borderTopRightRadius', 'borderBottomRightRadius', 'borderBottomLeftRadius']
    .map(k => Math.max(0, Math.min(parseFloat(cs[k]) || 0, w / 2, h / 2) - d));
  const arc = (cx, cy, r, a0) => t => [cx + r * Math.cos(a0 + t / r), cy + r * Math.sin(a0 + t / r)];
  const segs = [
    {len: W - tl - tr, f: t => [d + tl + t, d]},
    {len: Math.PI / 2 * tr, f: arc(d + W - tr, d + tr, tr, -Math.PI / 2)},
    {len: Hh - tr - br, f: t => [d + W, d + tr + t]},
    {len: Math.PI / 2 * br, f: arc(d + W - br, d + Hh - br, br, 0)},
    {len: W - br - bl, f: t => [d + W - br - t, d + Hh]},
    {len: Math.PI / 2 * bl, f: arc(d + bl, d + Hh - bl, bl, Math.PI / 2)},
    {len: Hh - bl - tl, f: t => [d, d + Hh - bl - t]},
    {len: Math.PI / 2 * tl, f: arc(d + tl, d + tl, tl, Math.PI)}
  ].filter(sg => sg.len > .01);
  const L = segs.reduce((a, sg) => a + sg.len, 0);
  const n = Math.max(8, Math.round(L / (parseFloat(el.dataset.sp) || 18))); const step = L / n;
  let html = '';
  for(let i = 0; i < n; i++){
    let t = i * step;
    for(const sg of segs){ if(t <= sg.len){ const [x, y] = sg.f(t); html += `<i class="bulb" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px"></i>`; break; } t -= sg.len; }
  }
  el.insertAdjacentHTML('afterbegin', html);
}
const lights = root => (root || document).querySelectorAll('.marquee').forEach(placeBulbs);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => lights());
const STAR_SVG = '<svg viewBox="0 0 120 120" aria-hidden="true"><polygon points="118,60 104.4,71.9 110.2,89 92.5,92.5 89,110.2 71.9,104.4 60,118 48.1,104.4 31,110.2 27.5,92.5 9.8,89 15.6,71.9 2,60 15.6,48.1 9.8,31 27.5,27.5 31,9.8 48.1,15.6 60,2 71.9,15.6 89,9.8 92.5,27.5 110.2,31 104.4,48.1" fill="#FFC23D" stroke="#7A0C1E" stroke-width="3" stroke-linejoin="round"/><circle cx="60" cy="60" r="40" fill="none" stroke="#7A0C1E" stroke-width="1.5" stroke-dasharray="3 4"/></svg>';
const CROWN_SVG = '<svg class="crown" viewBox="0 0 36 20" aria-hidden="true"><path d="M2 18 L6 4 L12 12 L18 2 L24 12 L30 4 L34 18 Z" fill="#FFC23D" stroke="#7A4A00" stroke-width="1.5" stroke-linejoin="round"/><circle cx="18" cy="2.5" r="1.8" fill="#FFF0B8"/><circle cx="6" cy="4.5" r="1.5" fill="#FFF0B8"/><circle cx="30" cy="4.5" r="1.5" fill="#FFF0B8"/></svg>';
const ICON = {

  pause: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4.5" width="4.2" height="15" rx="1" fill="currentColor"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1" fill="currentColor"/></svg>',
  next: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5l10 7.5-10 7.5z" fill="currentColor"/><rect x="16.5" y="4.5" width="3" height="15" rx="1" fill="currentColor"/></svg>',

  ear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8.5a6 6 0 1 1 12 0c0 3.5-3 4.5-3 7.5a3.5 3.5 0 0 1-6.5 1.8"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0"/></svg>'
};

/* ---------------- Tuiles du tableau ---------------- */
const ALNUM = /[\p{L}\p{N}]/u;
const up = s => String(s || '').toLocaleUpperCase('fr-FR');
const maskOf = s => Array.from(up(s)).map(c => ALNUM.test(c) ? '_' : c).join('');
function cleanTitle(s){
  const raw = String(s || '').trim();
  const c = raw.replace(/\s*[\(\[][^\)\]]*[\)\]]/g, '').replace(/\s+-\s+.*\b(remaster(ed)?|version|edit|live|mix|mono|stereo)\b.*$/i, '').trim();
  return c || raw;
}
function tileStats(s){
  const w = up(s).split(/\s+/).filter(x => Array.from(x).some(c => ALNUM.test(c)));
  return {words: w.length, letters: Array.from(up(s)).filter(c => ALNUM.test(c)).length};
}
function splitLines(words, L){
  if(L === 1) return [words];
  const total = words.reduce((a, w) => a + w.length, 0) + words.length - 1;
  const target = total / L; const lines = [[]]; let cur = 0;
  for(const w of words){
    if(cur && cur + 1 + w.length / 2 > target && lines.length < L){ lines.push([]); cur = 0; }
    lines[lines.length - 1].push(w); cur += (cur ? 1 : 0) + w.length;
  }
  return lines;
}
function tilesHTML(s, o){
  const words = up(s).trim().split(/\s+/).filter(Boolean).map(w => Array.from(w));
  if(!words.length) return '';
  let best = null;
  for(let L = 1; L <= 3 && L <= words.length; L++){
    const lines = splitLines(words, L);
    const need = Math.max(...lines.map(l => l.reduce((a, w) => a + w.length, 0) * 1.14 + (l.length - 1) * .4));
    const tw = Math.min(o.max || 48, o.maxW / need, o.maxH / (L * 1.29 + (L - 1) * .18));
    if(!best || tw > best.tw + .5) best = {tw, lines};
  }
  const tw = Math.max(8, Math.floor(best.tw)); let k = 0;
  return `<div class="tiles" style="--tw:${tw}px">` + best.lines.map(l => '<div class="tl">' + l.map(w => '<span class="tw">' + w.map(c => {
    if(c === '_') return '<i class="t off">♪</i>';
    if(ALNUM.test(c)) return `<i class="t on${o.anim ? ' flip' : ''}"${o.anim ? ` style="animation-delay:${(k++) * 55}ms"` : ''}>${esc(c)}</i>`;
